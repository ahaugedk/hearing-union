name: Request Codex Cloud coordination
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: write
concurrency:
  group: codex-main-coordination
  cancel-in-progress: false
jobs:
  request-task:
    if: github.repository == 'ahaugedk/hearing-union' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Request a new Cloud task through the Codex GitHub integration
        uses: actions/github-script@v7
        with:
          script: |
            const dispatch = require('./.github/scripts/codex-on-main.cjs');
            await dispatch({ github, context, core });
